name: Web Push Notifications Scheduler

on:
  schedule:
    # 06:06 Horário de Brasília (America/Sao_Paulo) -> 09:06 UTC (Versículo do Dia)
    - cron: '6 9 * * *'
    # 06:00 Brasília -> 09:00 UTC (Lembrete Matinal se versículo desativado)
    - cron: '0 9 * * *'
    # 11:00 Brasília -> 14:00 UTC (Lembrete Meio-dia)
    - cron: '0 14 * * *'
    # 16:00 Brasília -> 19:00 UTC (Lembrete Tarde)
    - cron: '0 19 * * *'
    # 21:00 Brasília -> 00:00 UTC (Lembrete Noite)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Tipo de notificação ("daily-verse" ou "reminder")'
        required: true
        default: 'daily-verse'
      slot:
        description: 'Slot de lembrete (ex: 06:00, 11:00, 16:00, 21:00)'
        required: false
        default: '11:00'

jobs:
  dispatch-push:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Envio Seguro de Web Push
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TYPE: ${{ github.event.inputs.type }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          TARGET_URL="${APP_URL:-https://amanhecer-beta.vercel.app}"
          # Remove barra final se houver
          TARGET_URL="${TARGET_URL%/}"

          if [ "$INPUT_TYPE" = "reminder" ]; then
            echo "Disparando Lembrete Manual ($INPUT_SLOT)..."
            curl -sS -X POST "$TARGET_URL/api/push/send-reminders?slot=${INPUT_SLOT:-11:00}" \
              -H "Authorization: Bearer $CRON_SECRET"
          elif [ "$INPUT_TYPE" = "daily-verse" ]; then
            echo "Disparando Versículo do Dia Manual..."
            curl -sS -X POST "$TARGET_URL/api/push/send-daily-verse" \
              -H "Authorization: Bearer $CRON_SECRET"
          elif [ "$SCHEDULE" = "0 9 * * *" ]; then
            echo "Disparando Lembrete Agendado (06:00 BRT)..."
            curl -sS -X POST "$TARGET_URL/api/push/send-reminders?slot=06:00" \
              -H "Authorization: Bearer $CRON_SECRET"
          elif [ "$SCHEDULE" = "0 14 * * *" ]; then
            echo "Disparando Lembrete Agendado (11:00 BRT)..."
            curl -sS -X POST "$TARGET_URL/api/push/send-reminders?slot=11:00" \
              -H "Authorization: Bearer $CRON_SECRET"
          elif [ "$SCHEDULE" = "0 19 * * *" ]; then
            echo "Disparando Lembrete Agendado (16:00 BRT)..."
            curl -sS -X POST "$TARGET_URL/api/push/send-reminders?slot=16:00" \
              -H "Authorization: Bearer $CRON_SECRET"
          elif [ "$SCHEDULE" = "0 0 * * *" ]; then
            echo "Disparando Lembrete Agendado (21:00 BRT)..."
            curl -sS -X POST "$TARGET_URL/api/push/send-reminders?slot=21:00" \
              -H "Authorization: Bearer $CRON_SECRET"
          else
            echo "Disparando Versículo do Dia Agendado (06:06 BRT)..."
            curl -sS -X POST "$TARGET_URL/api/push/send-daily-verse" \
              -H "Authorization: Bearer $CRON_SECRET"
          fi
